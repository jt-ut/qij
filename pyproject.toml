[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qij"
version = "0.1.0"
description = "Variance for estimators without a closed-form influence function"
requires-python = ">=3.9,<3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "joblib",
    "h5py",
    "matplotlib",
    # vqlp is the vector quantizer, from github.com/jt-ut/vqlp. Named plainly
    # rather than pinned to a path or a URL, so it resolves against whatever
    # is installed: an editable checkout on a workstation, a normal install
    # from GitHub on a cluster. Install it before this package.
    "vqlp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qij = ["data/*.npz", "data/*.h5"]
